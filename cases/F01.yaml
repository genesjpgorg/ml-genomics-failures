id: F01
title: Genome → organism image learns phylogeny, not phenotype
domain: >-
  Genotype-to-phenotype; DNA language model (ModernGENA) aligned to BioCLIP image space, decoded with Stable
  Diffusion (genes.jpg).
classes: [S, A]
claim: >-
  From random 6.3 kb nuclear-genome windows, the model places held-out species in the right family (25/30 held-out
  mammals, family top-1 0.83) and generates images that look like the organism.
mechanism: >-
  Each species has one genome, so the training target is effectively a species label. The loss also includes a
  taxonomy-caption term, and BioCLIP's image space is organized by taxonomy. The model learns "which lineage is this
  genome from" and returns its nearest training relative's appearance. Nothing tests whether DNA predicts phenotype
  beyond what phylogeny already predicts.
red_flags:
  - >-
    Accuracy degrades by taxonomic distance, not by trait: new species from a known family 0.83 family top-1, new
    families 0.00 at family and order level (class only).
  - "Generated images show the nearest relative: horse → zebras, black rhino → elephants."
  - >-
    A frozen-embedding ridge regression gets 0.53–0.58 species top-1 on seen species and 0.00 on new ones:
    seen-species scores are memorization.
  - A composition-only k-mer nearest neighbour already gets 0.67 family top-1 on new species.
test: >-
  A nearest-relative baseline using true phylogenetic distance (tree distance, Mash/ANI) that returns the relative's
  photos. Score traits (body size, habitat, colour) and test whether DNA explains the variation left after phylogeny
  (phylogenetic contrasts). Look at lineages where phenotype breaks from phylogeny (whales vs hippos, seals).
fix: >-
  Report results as phylogenetic signal unless they beat the phylogeny baseline. Select phenotype-relevant loci,
  including non-coding regulatory DNA (promoters, enhancers and their target-gene context) as well as coding
  sequences; a low coding fraction is not a reason to dismiss non-coding DNA. Changes in gene regulation are a
  major mechanism of animal morphological evolution: regulatory changes appear to predominate in repeated
  marine–freshwater stickleback adaptation (Jones et al.), and functional experiments implicate changes in a
  non-coding limb enhancer in snake limb loss (Kvon et al.). These findings motivate regulatory modeling within
  animal classes and infraclasses and across deeper evolutionary comparisons, but do not establish that most
  phenotype-changing mutations are non-coding at every taxonomic rank.
  Prioritize sequence-to-expression models as a biologically motivated intermediate layer: non-coding regulatory
  changes can alter where, when and how much a gene is expressed, linking DNA variation to phenotype.
  Use domain knowledge and measured biological signals to supervise DNA → gene expression, chromatin states or
  other functional features → phenotype, with intermediate targets matched to relevant tissues, cell types and
  developmental stages. Validate predicted expression differences across held-out species, not just expression
  levels across genes (see F05), and test whether the intermediate features improve phenotype prediction beyond
  the phylogeny baseline; this is a proposed modeling strategy, not a demonstrated fix for F01.
sources:
  - citation: genes.jpg control B report (run tol200m-refseq-diverse-genome).
    url: https://github.com/genesjpgorg/genes.jpg/blob/main/docs/reports/control-b-shuffle-tokens.md
  - citation: Felsenstein J. Phylogenies and the comparative method. Am Nat 125:1–15 (1985).
  - citation: Jones FC, et al. The genomic basis of adaptive evolution in threespine sticklebacks. Nature 484:55–61 (2012).
    url: https://doi.org/10.1038/nature10944
  - citation: Kvon EZ, et al. Progressive Loss of Function in a Limb Enhancer during Snake Evolution. Cell 167:633–642.e11 (2016).
    url: https://doi.org/10.1016/j.cell.2016.09.028
status:
  state: internal
  date: 2026-10-04
  pending: Genome-permutation null (control C) prepared, not trained; phylogeny baseline not built.
