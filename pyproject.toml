[project]
name = "ml-genomics-failures"
version = "0.1.0"
description = "Book of failures for ML in genomics: documented pitfalls and the tests that expose them, as an MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.3,<3", "numpy>=1.26", "uvicorn>=0.30"]

[project.scripts]
ml-genomics-failures-mcp = "ml_genomics_failures.server:main"

[project.urls]
Repository = "https://github.com/genesjpgorg/ml-genomics-failures"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_genomics_failures"]

[tool.ruff]
line-length = 120
